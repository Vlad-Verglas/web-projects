<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fun survey about The Lord of the Rings.">
    <link rel="stylesheet" href="./index.css">
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">The Lord of the Rings Survey</h1>
    <p id="description">Answer a few questions and tell us what you think about Middle-earth.</p>

    <form id="survey-form">
      <div>
        <label id="name-label" for="name">Name (Required): </label>
        <input
          id="name"
          type="text"
          placeholder="Frodo"
          required
        >
      </div>

      <div>
        <label id="email-label" for="email">Email (Required): </label>
        <input
          id="email"
          type="email"
          placeholder="frodo@example.com"
          required
        >
      </div>

      <div>
        <label id="number-label" for="number">How many times have you watched the movies? (Required): </label>
        <input
          id="number"
          type="number"
          name="number"
          placeholder="3"
          min="1"
          max="20"
          required
        >
      </div>
      
      <div>
        <label for="dropdown">Who is your favorite character? </label>
        <select id="dropdown" name="character">
          <option value="frodo">Frodo</option>
          <option value="aragorn">Aragorn</option>
          <option value="gandalf">Gandalf</option>
          <option value="legolas">Legolas</option>
          <option value="gollum">Gollum</option>
          <option value="sam">Sam</option>
        </select>
      </div>
    
      <div>
        <p>Which do you prefer?</p>

        <input
          id="books"
          type="radio"
          name="preference"
          value="books"
        >
        <label for="books">Books</label>

        <input
          id="movies"
          type="radio"
          name="preference"
          value="movies"
        >
        <label for="movies">Movies</label>
      </div>

      <div>
        <p>Which places did you like the most?</p>

        <input
          id="shire"
          type="checkbox"
          name="favourite"
          value="shire"
        >
        <label for="shire">The Shire</label>

        <input
          id="rivendell"
          type="checkbox"
          name="favourite"
          value="rivendell"
        >
        <label for="rivendell">Rivendell</label>

        <input
          id="moria"
          type="checkbox"
          name="favourite"
          value="moria"
        >
        <label for="moria">Moria</label>

        <input
          id="lothlorien"
          type="checkbox"
          name="favourite"
         value="lothlorien"
        >
        <label for="lothlorien">Lothlórien</label>

        <input
          id="helms-deep"
          type="checkbox"
          name="favourite"
          value="helms-deep"
        >
        <label for="helms-deep">Helm's Deep</label>

        <input
          id="minas-tirith"
          type="checkbox"
          name="favourite"
          value="minas-tirith"
        >
        <label for="minas-tirith">Minas Tirith</label>

        <input
          id="mordor"
          type="checkbox"
          name="favourite"
          value="mordor"
        >
        <label for="mordor">Mordor</label>

        <input
          id="isengard"
          type="checkbox"
          name="favourite"
          value="isengard"
        >
        <label for="isengard">Isengard</label>

        <input
          id="rohan"
          type="checkbox"
          name="favourite"
          value="rohan"
        >
        <label for="rohan">Rohan</label>

        <input
        id="gondor"
        type="checkbox"
        name="favourite"
        value="gondor"
        >
        <label for="gondor">Gondor</label>
      </div>
      <div>
        <label for="comments">any additional comments?</label>
        <div>
          <textarea 
            id="comments"
            name="comments"
            rows="5" 
            cols="40"
            placeholder="tell us your favorite scene and why..."
          ></textarea>
        </div>
        <button id="submit" type="submit">send to Rivendell</button>
      </div>
    </form>
  </body>
</html>
